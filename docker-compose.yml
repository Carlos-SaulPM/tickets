name: tickets

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-tickets}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-tickets}"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    build:
      context: ./backend
      target: migrate
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-tickets}?schema=public
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  app:
    profiles: ["dev"]
    build:
      context: ./backend
      target: dev
    environment:
      NODE_ENV: development
      PORT: 3000
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-tickets}?schema=public
    ports:
      - "${APP_PORT:-3000}:3000"
    volumes:
      - ./backend:/app
      - /app/node_modules
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  frontend:
    profiles: ["dev"]
    build:
      context: ./frontend/tickets_frontend
      target: dev
    environment:
      NODE_ENV: development
    ports:
      - "${FRONTEND_PORT:-3001}:3000"
    volumes:
      - ./frontend/tickets_frontend:/app
      - /app/node_modules
      - /app/.next
    restart: unless-stopped

  app-prod:
    profiles: ["prod"]
    build:
      context: ./backend
      target: prod
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-tickets}?schema=public
    ports:
      - "${APP_PROD_PORT:-8080}:3000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  frontend-prod:
    profiles: ["prod"]
    build:
      context: ./frontend/tickets_frontend
      target: prod
    environment:
      NODE_ENV: production
      PORT: 3000
    ports:
      - "${FRONTEND_PROD_PORT:-8081}:3000"
    restart: unless-stopped

volumes:
  pgdata:
