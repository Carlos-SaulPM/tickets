name: tickets

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-tickets}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-tickets}",
        ]
      interval: 5s
      timeout: 5s
      retries: 10

  mailpit:
    profiles: ["dev"]
    image: axllent/mailpit:v1.27
    restart: unless-stopped
    environment:
      MP_MAX_MESSAGES: 500
    ports:
      - "${MAILPIT_PORT:-8025}:8025"

  migrate:
    build:
      context: ./backend
      target: migrate
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-tickets}?schema=public
      UPLOADS_DIR: /app/uploads
      SEED_DEMO: ${SEED_DEMO:-false}
    volumes:
      - uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  app:
    profiles: ["dev"]
    build:
      context: ./backend
      target: dev
    environment:
      NODE_ENV: development
      PORT: 3000
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-tickets}?schema=public
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET es requerida}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-3600}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3001}
      SMTP_HOST: ${SMTP_HOST:-mailpit}
      SMTP_PORT: ${SMTP_PORT:-1025}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-Sistema de Tickets <no-reply@sistema-tickets.local>}
    ports:
      - "${APP_PORT:-3000}:3000"
    volumes:
      - ./backend:/app
      - /app/node_modules
      - /app/src/generated
      - uploads:/app/uploads
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  frontend:
    profiles: ["dev"]
    build:
      context: ./frontend/tickets_frontend
      target: dev
    environment:
      NODE_ENV: development
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:3000/api/v1}
      API_URL_INTERNA: ${API_URL_INTERNA:-http://app:3000/api/v1}
    ports:
      - "${FRONTEND_PORT:-3001}:3000"
    volumes:
      - ./frontend/tickets_frontend:/app
      - /app/node_modules
      - /app/.next
    restart: unless-stopped

  app-prod:
    profiles: ["prod"]
    build:
      context: ./backend
      target: prod
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-tickets}?schema=public
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET es requerida}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-3600}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:8081}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-Sistema de Tickets <no-reply@sistema-tickets.local>}
    volumes:
      - uploads:/app/uploads
    ports:
      - "${APP_PROD_PORT:-8080}:3000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  frontend-prod:
    profiles: ["prod"]
    build:
      context: ./frontend/tickets_frontend
      target: prod
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8080/api/v1}
    environment:
      NODE_ENV: production
      PORT: 3000
      API_URL_INTERNA: ${API_URL_INTERNA:-http://app-prod:3000/api/v1}
    ports:
      - "${FRONTEND_PROD_PORT:-8081}:3000"
    restart: unless-stopped

volumes:
  pgdata:
  uploads:
